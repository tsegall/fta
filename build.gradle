plugins {
	id "com.github.ben-manes.versions"
	id "com.github.spotbugs" version "6.5.11" apply false
}

import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

wrapper {
	gradleVersion = '9.7.1'
}

if (JavaVersion.current() > JavaVersion.VERSION_21) {
	throw new GradleException("This build requires JDK 21 or lower (DataSketches dependency does not support JDK 22+). Current JDK: ${JavaVersion.current()}")
}

tasks.register('semanticTypesTest') {
	group       = 'verification'
	description = 'Run the semantic-types regression suite (requires ../Semantic-types checkout)'

	dependsOn ':cli:installDist'

	def suiteDir = file('../Semantic-types')
	onlyIf {
		if (!suiteDir.exists()) {
			logger.warn('semanticTypesTest skipped: ../Semantic-types not found')
			return false
		}
		return true
	}

	doLast {
		def proc = new ProcessBuilder('bin/runSuiteM.sh')
			.directory(suiteDir)
			.start()

		// Drain stdout and stderr on separate threads. Without active draining the
		// Gradle-daemon pipe buffers fill when makedb/CLI produce heavy output, causing
		// proc.waitFor() to block indefinitely.
		def outThread = Thread.start { proc.inputStream.eachLine { line -> println line } }
		def errThread = Thread.start { proc.errorStream.eachLine { line -> System.err.println line } }

		def exitCode = proc.waitFor()
		outThread.join()
		errThread.join()

		if (exitCode != 0)
			throw new GradleException("runSuiteM.sh failed with exit code $exitCode")

		def reference = new File(suiteDir, 'reference.csv')
		def current   = new File(suiteDir, 'ncurrent.csv')

		def diffProc = new ProcessBuilder('diff', '-q', reference.absolutePath, current.absolutePath)
			.directory(suiteDir)
			.start()
		def diffExit = diffProc.waitFor()
		if (diffExit != 0)
			throw new GradleException(
				"Semantic-types regression suite: ncurrent.csv differs from reference.csv. " +
				"Run: diff ../Semantic-types/reference.csv ../Semantic-types/ncurrent.csv"
			)
		logger.lifecycle('Semantic-types suite passed: ncurrent.csv matches reference.csv')
	}
}

tasks.register('examples.clean') {
    dependsOn gradle.includedBuilds*.task(':clean')
}

tasks.register('examples.build') {
    dependsOn gradle.includedBuilds*.task(':build')
}

tasks.register('examples.run') {
    dependsOn gradle.includedBuilds*.task(':run')
}

subprojects {
	repositories {
		mavenCentral()
		gradlePluginPortal()
	}

	apply plugin: 'eclipse'
	apply plugin: 'jacoco'
	apply plugin: 'java-library-distribution'
	apply plugin: 'signing'
	apply plugin: 'maven-publish'

	version = libs.versions.fta.get()
	group = "com.cobber.fta"

	compileJava {
	    options.release = 17
	    options.compilerArgs.add("-Xlint:unchecked")
	}

	java {
		withSourcesJar()
		withJavadocJar()
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
	}

	jacoco {
		toolVersion = libs.versions.jacoco.get()
	}

	jacocoTestReport {
		dependsOn test
		reports {
			xml.required = true
		}
	}

	tasks.named("assemble") {
		dependsOn javadocJar
		dependsOn sourcesJar
	}

	jar {
		manifest {
			attributes(
				'Build-Timestamp': new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
				'Implementation-Version': archiveVersion
			)
		}
	}

	javadoc {
		options.encoding = "UTF-8"
		options.noQualifiers 'java.lang:java.util:com.cobber.fta:com.cobber.fta.core'
	}


	test {
		// enable TestNG support (default is JUnit)
		def groups = System.getProperty('groups', 'all')
			useTestNG() {
				includeGroups groups
			}
		dependsOn cleanTest
		testLogging.showStandardStreams = true
		maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
	}

	publishing {
		repositories {
			maven {
				name = "ossrh-staging-api"
				url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
				credentials {
					username = findProperty('ossrhUsername')
					password = findProperty('ossrhPassword')
				}
			}
		}

		publications {
			mavenJava(MavenPublication) {
			    switch(artifactId) {
				case 'core':
					artifactId = 'fta-core'
					break
				case 'types':
					artifactId = 'fta'
					break
				default:
					break
				}
				from components.java

				pom {
					name = 'Fast Text Analyzer'
					packaging = 'jar'
					description = 'Analyze Text data to determine simple type and Semantic type information as well as other key metrics associated with a text stream.'
					url = 'https://github.com/tsegall/fta'

					scm {
					    connection = 'scm:git:https://github.com/tsegall/fta.git'
					    developerConnection = 'scm:git:https://github.com/tsegall/fta.git'
					    url = 'https://github.com/tsegall/fta.git'
					}

				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}

				developers {
					developer {
						id = 'tsegall'
						name = 'Tim Segall'
						email = 'xtim@cobber.com'
					}
				}
			    }
			}
		}
	}

	signing {
		def signingKey = findProperty("signingKey")
		def signingPassword = findProperty("signingPassword")
		useInMemoryPgpKeys(signingKey, signingPassword)
		sign publishing.publications.mavenJava
	}

	apply plugin: "com.github.spotbugs"

	spotbugs {
		toolVersion = "4.10.4"
		effort = Effort.MAX
		reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
		ignoreFailures = true
	}

	tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
		reports {
		xml.required = false
		html.required = true
        }
    }
}
